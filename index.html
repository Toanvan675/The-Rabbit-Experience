<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Rabbit Experience</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }

        #game-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            image-rendering: pixelated; 
            image-rendering: crisp-edges; 
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
        }

        #eye-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 22; 
        }

        #crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 100; 
            opacity: 0.6;
            box-shadow: inset 0 0 150px rgba(0,0,0,0.9); 
        }

        #noise-overlay {
            position: fixed;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            pointer-events: none;
            background: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
            animation: tv-noise 0.12s infinite;
            opacity: 0.15; 
            z-index: 99;
            mix-blend-mode: overlay;
        }

        @keyframes tv-noise {
            0%, 100% { transform: translate(0, 0); }
            10% { transform: translate(-1%, -1%); }
            20% { transform: translate(1%, 2%); }
            30% { transform: translate(-2%, -1%); }
            40% { transform: translate(1%, 1%); }
            50% { transform: translate(-1%, 2%); }
            60% { transform: translate(2%, -1%); }
            70% { transform: translate(-1%, -2%); }
            80% { transform: translate(1%, -1%); }
            90% { transform: translate(2%, 1%); }
        }

        #rabbit-hand-overlay {
            position: absolute;
            top: 62%; left: 84%;
            transform: translate(-35%, -45%);
            width: 48vw;
            max-width: 550px;
            height: auto;
            z-index: 25;
            pointer-events: none;
            transition: opacity 0.6s ease-in-out;
            opacity: 0;
        }
        #rabbit-hand-overlay.visible { opacity: 1 !important; }
        #rabbit-hand-overlay img {
            width: 50%; 
            transform: scale(2); 
            transform-origin: bottom right;
            height: auto;
            display: block;
            mix-blend-mode: screen;
            image-rendering: pixelated; 
            filter: drop-shadow(-2px -2px 5px rgba(0,0,0,0.8)) sepia(0.3) contrast(1.5) grayscale(0.2);
        }

        .ui-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 10;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background-color: transparent;
            color: #fff;
            text-align: center;
        }
        
        .menu-bg {
            background: radial-gradient(circle at center, rgba(40, 10, 10, 0.85) 0%, rgba(5, 5, 5, 0.98) 100%); 
            position: absolute;
            width: 100%; height: 100%;
            z-index: -1;
        }

        .hidden { display: none !important; }

        @keyframes flicker {
            0% { opacity: 1; text-shadow: 3px 3px 0 #500000; }
            5% { opacity: 0.2; text-shadow: none; }
            10% { opacity: 1; text-shadow: 3px 3px 0 #500000; }
            15% { opacity: 0.1; }
            25% { opacity: 1; text-shadow: 3px 3px 0 #500000; }
            80% { opacity: 1; text-shadow: 3px 3px 0 #500000; }
            82% { opacity: 0.5; }
            84% { opacity: 1; text-shadow: 3px 3px 0 #500000; }
            100% { opacity: 1; text-shadow: 3px 3px 0 #500000; }
        }
        
        @keyframes gentle-flicker {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.85; transform: scale(1.02); }
        }

        @keyframes blink-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        .blinking { animation: blink-slow 1.2s infinite; }

        h1 {
            font-size: 8rem;
            color: #fff; 
            margin-bottom: 50px;
            font-family: 'Caveat', cursive;
            animation: flicker 4s infinite;
            position: relative;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
        }

        .rabbit-text {
            color: #ffffff;
            position: relative;
            display: inline-block;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
        }

        .blood-drop {
            position: absolute;
            width: 4px; height: 15px;
            background: linear-gradient(to bottom, transparent, #cc0000 40%, #7a0000);
            border-radius: 50px;
            pointer-events: none;
            z-index: 20; 
            opacity: 0;
            filter: drop-shadow(0 0 3px #ff0000);
        }

        .drop-1 { left: 15%; bottom: 10px; animation: drip 3.2s infinite ease-in; }
        .drop-2 { left: 45%; bottom: 5px; width: 5px; height: 22px; animation: drip 2.7s infinite ease-in 1.2s; }
        .drop-3 { left: 70%; bottom: 15px; width: 3px; height: 18px; animation: drip 3.8s infinite ease-in 0.5s; }
        .drop-4 { left: 90%; bottom: 8px; width: 4px; height: 16px; animation: drip 3.0s infinite ease-in 2.1s; }

        @keyframes drip {
            0% { transform: translateY(0) scaleY(0.5); opacity: 0; }
            5% { transform: translateY(0) scaleY(1.2); opacity: 1; }
            95% { opacity: 1; }
            100% { transform: translateY(100vh) scaleY(2.5); opacity: 0; }
        }

        .beta-tag {
            position: absolute;
            bottom: 5px; right: -40px;
            font-size: 2rem; color: #ff3333;
            transform: rotate(-15deg);
            animation: flicker 3s infinite reverse;
            text-transform: lowercase;
            font-family: 'Courier New', Courier, monospace;
        }

        #main-menu button, #pause-menu button, #settings-menu button, #credit-menu button, #donate-menu button {
            font-family: 'Caveat', cursive;
            text-transform: none;
            color: #990000;
            background: transparent;
            border: none;
            box-shadow: none;
            font-size: 3.5rem;
            padding: 5px 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        #main-menu button:hover, #pause-menu button:hover, #settings-menu button:hover, #credit-menu button:hover, #donate-menu button:hover {
            color: #fff;
            text-shadow: 0 0 15px #f00, 0 0 30px #f00;
            transform: scale(1.15);
            letter-spacing: 2px;
        }

        .menu-btns-vertical { 
            display: flex; flex-direction: column; 
            gap: 15px; align-items: center;
        }

        #btn-play, #btn-resume { font-size: 5rem !important; margin-bottom: 10px; color: #cc0000; }

        .info-panel {
            background: rgba(15,10,10,0.95);
            border: 2px solid #522;
            padding: 40px;
            width: 450px;
            margin-bottom: 20px;
            box-shadow: 0 0 40px rgba(255,0,0,0.2);
            border-radius: 10px;
        }

        #btn-ingame-menu {
            position: absolute;
            top: 20px; left: 20px;
            font-size: 2.5rem;
            padding: 5px 15px;
            z-index: 5;
            background: rgba(0,0,0,0.6);
            border: 2px solid #555;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            display: flex; justify-content: center; align-items: center;
            color: #fff;
        }
        #btn-ingame-menu:hover { background: rgba(200,0,0,0.8); border-color: #f00; }

        .setting-row { display: flex; justify-content: space-between; align-items: center; margin: 20px 0; font-size: 1.2rem; font-family: 'Courier New', Courier, monospace;}
        .setting-row input[type="range"] { width: 200px; cursor: pointer; }

        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 6px; height: 6px;
            background-color: rgba(255, 255, 255, 0.8);
            transform: translate(-50%, -50%);
            z-index: 5;
            border-radius: 50%;
            transition: all 0.2s ease-in-out;
            pointer-events: none;
        }
        #crosshair.glow { width: 8px; height: 8px; background-color: #ff3333; box-shadow: 0 0 15px #ff0000, 0 0 5px #ff0000; }

        #hover-text {
            position: absolute;
            top: 55%; left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 1.2rem;
            text-shadow: 1px 1px 3px #000;
            pointer-events: none;
            z-index: 5;
            font-family: 'Courier New', Courier, monospace;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid #fff;
        }

        #flashlight-ui {
            position: absolute;
            bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 70px; height: 70px;
            background-color: rgba(0, 0, 0, 0.5);
            border: 2px solid #888; border-radius: 10px;
            z-index: 5; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: all 0.2s;
        }
        #flashlight-ui.active { background-color: rgba(255, 255, 200, 0.6); border-color: #fff; box-shadow: 0 0 20px rgba(255, 255, 200, 0.5); }
        #flashlight-ui img { width: 40px; height: 40px; object-fit: contain; }
        #flashlight-ui.disabled { opacity: 0.2; pointer-events: none; }

        .key-hint {
            position: absolute;
            bottom: -5px; right: -5px;
            width: 24px; height: 24px;
            background: rgba(200, 0, 0, 0.9);
            border-radius: 50%;
            font-size: 14px; font-weight: bold;
            display: flex; justify-content: center; align-items: center;
            border: 2px solid #fff; color: white;
            font-family: 'Courier New', Courier, monospace;
            pointer-events: none;
            box-shadow: 0 0 5px rgba(0,0,0,0.8);
        }
        .esc-hint { width: 30px; height: 30px; font-size: 11px; bottom: -10px; right: -10px; background: rgba(50, 50, 50, 0.9); }

        #instructions {
            position: absolute;
            top: 20px; right: 20px;
            color: rgba(255,255,255,0.6);
            z-index: 5; font-size: 1rem;
            pointer-events: none;
            background: rgba(0,0,0,0.3); padding: 10px; border-right: 3px solid #fff;
            text-align: right; transition: opacity 2s ease-in-out; opacity: 1;
        }

        #objective-ui {
            position: absolute;
            top: 80px; left: 20px;
            color: #fff;
            font-size: 1.2rem;
            font-family: 'Courier New', Courier, monospace;
            z-index: 5;
            text-shadow: 2px 2px 4px #000, 0 0 10px rgba(255,0,0,0.5);
            pointer-events: none;
            background: rgba(0,0,0,0.5);
            padding: 8px 15px;
            border-left: 3px solid #cc0000;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        #subtitle {
            position: absolute;
            top: 10%; left: 50%; transform: translateX(-50%);
            color: #fff; font-size: 1.5rem; text-shadow: 2px 2px 4px #000;
            z-index: 6; text-align: center; pointer-events: none;
            opacity: 0; transition: opacity 0.5s ease-in-out;
            max-width: 80%; white-space: pre-wrap; 
        }

        #fade-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: black;
            z-index: 20; opacity: 0; pointer-events: none;
            transition: opacity 3s ease-in-out, background-color 1s;
            display: flex; justify-content: center; align-items: center;
            color: white; font-size: 3rem; font-weight: bold;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shaking { animation: shake 0.1s infinite; }

        .news-broadcast-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a2a42 0%, #050a11 100%);
            font-family: 'Arial', sans-serif; z-index: 10;
            display: flex; flex-direction: column; justify-content: flex-end;
            overflow: hidden;
        }
        .news-anchor-box {
            position: absolute; top: 20%; right: 10%; width: 320px; height: 380px;
            background: #0d1b2a; border: 4px solid #334155; border-radius: 8px;
            overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .news-anchor-avatar {
            width: 140px; height: 140px; background: #1e293b; border-radius: 50%;
            border: 3px solid #64748b; display: flex; justify-content: center; align-items: center;
            margin-bottom: 20px; position: relative; box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        .news-anchor-avatar::before {
            content: '👤'; font-size: 70px;
        }
        .news-anchor-name {
            background: #cc0000; color: white; padding: 6px 15px; font-size: 1.1rem;
            font-weight: bold; border-radius: 4px; letter-spacing: 1px;
        }
        .news-live-bug {
            position: absolute; top: 40px; left: 40px;
            background: #cc0000; color: white; padding: 8px 20px;
            font-size: 1.8rem; font-weight: bold; letter-spacing: 2px;
            border-radius: 4px; box-shadow: 0 0 10px rgba(0,0,0,0.5);
            display: flex; align-items: center; gap: 10px;
        }
        .news-live-dot {
            width: 15px; height: 15px; background: white; border-radius: 50%;
            animation: blink-slow 1s infinite;
        }
        .news-channel-logo {
            position: absolute; top: 30px; right: 450px;
            width: 120px; height: 120px;
            background: rgba(255,255,255,0.1); border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            flex-direction: column; text-align: center;
        }
        .news-channel-logo span { font-weight: 900; font-size: 2.2rem; color: white; line-height: 1; }
        .news-channel-logo small { font-size: 1rem; color: #aaa; margin-top: 5px; }
        
        .news-lower-third {
            width: 100%; position: relative; z-index: 15;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
        }
        .news-headline-row {
            display: flex; align-items: stretch; height: auto; min-height: 80px;
        }
        .news-breaking-tag {
            background: #cc0000; color: white; padding: 15px 30px;
            font-size: 3rem; font-weight: 900; display: flex; align-items: center;
            text-transform: uppercase; white-space: nowrap;
        }
        .news-main-headline {
            background: rgba(250, 250, 250, 0.95); color: #111;
            flex-grow: 1; display: flex; align-items: center; padding: 15px 30px;
            font-size: 2.8rem; font-weight: 800; text-transform: uppercase;
        }
        .news-sub-headline {
            background: rgba(10, 40, 100, 0.95); color: white;
            padding: 15px 30px; font-size: 1.8rem; font-weight: 500;
            text-align: left; line-height: 1.4;
        }
        .news-ticker {
            background: #000; color: #ffcc00; padding: 10px 0;
            font-size: 1.6rem; font-family: 'Courier New', Courier, monospace;
            font-weight: bold; white-space: nowrap; overflow: hidden;
            border-top: 2px solid #333;
        }
        .news-ticker span {
            display: inline-block;
            padding-left: 100vw;
            animation: ticker-move 20s linear infinite;
        }
        @keyframes ticker-move {
            0% { transform: translate(0, 0); }
            100% { transform: translate(-100%, 0); }
        }
        
        .ending-summary {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 20;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 3s ease-in-out;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div id="crt-overlay"></div>
    <div id="noise-overlay"></div>
    <div id="fade-overlay"><span id="end-text"></span></div>
    
    <canvas id="eye-canvas"></canvas>

    <div id="hud" class="hidden">
        <button id="btn-ingame-menu">
            ☰
            <div class="key-hint esc-hint">ESC</div>
        </button>
        <div id="crosshair"></div>
        <div id="hover-text" class="hidden"></div>
        <div id="flashlight-ui">
            <img src="flashlight.png" onerror="this.onerror=null; this.src='https://placehold.co/50x50/333/fff?text=FL';" alt="Flashlight">
            <div class="key-hint">F</div>
        </div>
        <div id="subtitle"></div>
        <div id="rabbit-hand-overlay">
            <img src="Hand.jpg" onerror="this.onerror=null; this.src='https://placehold.co/400x300/111/f00?text=Hand.jpg+Missing';" alt="Holding Rabbit">
        </div>
        <div id="objective-ui">Objective: Go home</div>
        <div id="instructions">
            [W,A,S,D] Move<br>
            [Leftclick] Interact<br>
            [F] Flashlight<br>
            [ESC] Menu
        </div>
    </div>

    <!-- Main Menu -->
    <div id="main-menu" class="ui-layer">
        <div class="menu-bg"></div>
        <h1 style="position: relative; z-index: 2;">
            The <span class="rabbit-text">Rabbit
                <span class="blood-drop drop-1"></span>
                <span class="blood-drop drop-2"></span>
                <span class="blood-drop drop-3"></span>
                <span class="blood-drop drop-4"></span>
            </span> Experience
            <span class="beta-tag">beta</span>
        </h1>
        <div class="menu-btns-vertical" style="position: relative; z-index: 2;">
            <button id="btn-play">Play</button>
            <button id="btn-credit">Credits</button>
            <button id="btn-donate">Donate</button>
        </div>
    </div>

    <!-- Pause Menu -->
    <div id="pause-menu" class="ui-layer hidden" style="z-index: 15;">
        <div class="menu-bg"></div>
        <h2 style="font-family: 'Caveat', cursive; font-size: 6rem; color: #cc0000; margin-bottom: 30px; animation: flicker 4s infinite;">Paused</h2>
        <div class="menu-btns-vertical">
            <button id="btn-resume">Continue</button>
            <button id="btn-settings">Settings</button>
            <button id="btn-quit-main">Main Menu</button>
        </div>
    </div>

    <!-- Settings Menu -->
    <div id="settings-menu" class="ui-layer hidden" style="z-index: 16;">
        <div class="menu-bg"></div>
        <div class="info-panel">
            <h2 style="font-family: 'Caveat', cursive; font-size: 3rem; color: #cc0000; font-family: 'Courier New', Courier, monospace;">Settings</h2>
            <div class="setting-row">
                <label>Volume:</label>
                <input type="range" id="vol-slider" min="0" max="1" step="0.1" value="1">
            </div>
            <div class="setting-row">
                <label>FOV:</label>
                <input type="range" id="fov-slider" min="50" max="100" step="5" value="65">
            </div>
        </div>
        <button id="btn-settings-back" class="btn-back">Back</button>
    </div>

    <!-- Credit Menu -->
    <div id="credit-menu" class="ui-layer hidden">
        <div class="menu-bg"></div>
        <div class="info-panel">
            <h2 style="font-family: 'Caveat', cursive; font-size: 3rem; color: #cc0000; font-family: 'Courier New', Courier, monospace;">Credits</h2>
            <p style="font-size: 1.2rem; color: #aaa; font-family: 'Courier New', Courier, monospace;">"Toàn đẹp trai" made this shit</p>
        </div>
        <button class="btn-back">Back</button>
    </div>

    <!-- Donate Menu -->
    <div id="donate-menu" class="ui-layer hidden">
        <div class="menu-bg"></div>
        <div class="info-panel">
            <h2 style="font-family: 'Caveat', cursive; font-size: 3rem; color: #cc0000; font-family: 'Courier New', Courier, monospace;">Donate</h2>
            <p style="font-family: 'Courier New', Courier, monospace;">[ SCAN TO SUPPORT ]</p>
            <img src="image_cad759.jpg" onerror="this.onerror=null; this.src='https://placehold.co/300x400/111/f00?text=QR+Code+Missing';" alt="QR Donate" style="width: 300px; max-width: 100%; height: auto; margin: 0 auto; display: block; border: 4px solid #333; border-radius: 10px;">
        </div>
        <button class="btn-back">Back</button>
    </div>

    <script>
        const eyeCanvas = document.getElementById('eye-canvas');
        const eyeCtx = eyeCanvas.getContext('2d');
        let eyeAnimState = 0; 
        let eyeAnimTimer = 0;

        function resizeEyeCanvas() {
            eyeCanvas.width = window.innerWidth;
            eyeCanvas.height = window.innerHeight;
            if (eyeAnimState === 0) eyeCtx.clearRect(0, 0, eyeCanvas.width, eyeCanvas.height);
        }
        window.addEventListener('resize', resizeEyeCanvas);
        resizeEyeCanvas();

        function startEyeWakeUp() {
            eyeAnimState = 1; eyeAnimTimer = 0; updateEyeAnimation(0); 
        }

        function updateEyeAnimation(delta) {
            if (eyeAnimState === 0) return;
            eyeAnimTimer += delta; let progress = 0;
            if (eyeAnimTimer < 0.6) progress = (eyeAnimTimer / 0.6) * 0.25;
            else if (eyeAnimTimer < 1.0) { let t = (eyeAnimTimer - 0.6) / 0.4; progress = 0.25 - (t * 0.20); } 
            else if (eyeAnimTimer < 3.5) { let t = (eyeAnimTimer - 1.0) / 2.5; progress = 0.05 + (t * 0.95); } 
            else { progress = 1; eyeAnimState = 0; }

            eyeCtx.clearRect(0, 0, eyeCanvas.width, eyeCanvas.height);
            if (progress >= 1) return; 

            const w = eyeCanvas.width; const h = eyeCanvas.height; const midY = h / 2;
            const openAmount = progress * h * 0.7; const curveFlatness = progress * h * 0.4;

                                <span style="color:#ff0000; font-size:4rem; margin-bottom: 20px; font-family: 'Caveat', cursive; text-shadow: 0 0 20px #ff0000; font-weight:bold; animation: gentle-flicker 2s infinite;">BAD ENDING</span>
                                <span style="color:#fff; font-size:2rem; margin-bottom: 40px; font-family: 'Courier New', monospace;">You have paid your price and are in hell</span>
                                <button id="btn-final-menu" style="font-size:2.5rem; padding:15px 40px; font-family: 'Courier New', monospace; background: rgba(0,0,0,0.8); color: #f00; border: 4px solid #f00; cursor: pointer; transition: all 0.3s; font-weight:bold;">MAIN MENU</button>
                            </div>`;
                        
                        void uiElems.fade.children[0].offsetWidth;
                        uiElems.fade.children[0].style.opacity = '1';

                        document.exitPointerLock(); const btnFinal = document.getElementById('btn-final-menu');
                        btnFinal.addEventListener('mouseover', (e) => { e.target.style.background = '#f00'; e.target.style.color = '#000'; e.target.style.boxShadow = '0 0 30px #f00'; });
                        btnFinal.addEventListener('mouseout', (e) => { e.target.style.background = 'rgba(0,0,0,0.8)'; e.target.style.color = '#f00'; e.target.style.boxShadow = 'none'; });
                        btnFinal.addEventListener('click', () => location.reload());
                    }, 3500);
                }
            }

            if (currentCycle === 2 && !isDaytime && !isPaused && !isWhiteForest) {
                if (sfx.rain && sfx.rain.paused && !isFinalJumpscare) { sfx.rain.volume = masterVolume; sfx.rain.play().catch(e => console.log("Missing rain.mp3")); }
                rainDrop.visible = true; const pos = rainDrop.geometry.attributes.position.array; for(let i = 1; i < rainCount * 3; i += 3) { pos[i] -= 30 * delta; if (pos[i] < 0) pos[i] = 40; } rainDrop.geometry.attributes.position.needsUpdate = true;
                if (!isFinalJumpscare) {
                    lightningTimer -= delta;
                    if (lightningTimer <= 0) {
                        scene.background.setHex(0xffffff); scene.fog.color.setHex(0xffffff);
                        setTimeout(() => { scene.background.setHex(0x111111); scene.fog.color.setHex(0x111111); }, 50); setTimeout(() => { scene.background.setHex(0xffffff); scene.fog.color.setHex(0xffffff); }, 100); setTimeout(() => { scene.background.setHex(0x060708); scene.fog.color.setHex(0x060708); }, 150);
                        playSound('thunder'); lightningTimer = Math.random() * 5 + 3; 
                    }
                }
            } else if (!isWhiteForest) { rainDrop.visible = false; if (sfx.rain && !sfx.rain.paused) sfx.rain.pause(); }
            
            if (controlsEnabled && !isFrozen) {
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera); const intersects = raycaster.intersectObjects(interactables);
                let isHoveringInteractable = false; let hoverStr = "";
                if (currentCycle !== 2 && intersects.length > 0 && intersects[0].distance < 6) {
                    const type = intersects[0].object.userData.type;
                    if (isAfternoon) { isHoveringInteractable = true; } else if (isDaytime && type === 'bed') { isHoveringInteractable = true; hoverStr = "."; } else if (!isDaytime || type === 'door') { isHoveringInteractable = true; }
                }
                if (isHoveringInteractable) uiElems.crosshair.classList.add('glow'); else uiElems.crosshair.classList.remove('glow');
                if (hoverStr !== "") { uiElems.hoverText.textContent = hoverStr; uiElems.hoverText.classList.remove('hidden'); } else { uiElems.hoverText.classList.add('hidden'); }

                const dir = new THREE.Vector3(); dir.z = Number(keys.w) - Number(keys.s); dir.x = Number(keys.d) - Number(keys.a); dir.normalize(); 
                const isMoving = (keys.w || keys.a || keys.s || keys.d) && dir.length() > 0;
                if (isMoving) {
                    const euler = new THREE.Euler(0, yaw, 0, 'YXZ'); const moveVec = new THREE.Vector3(dir.x, 0, -dir.z).applyEuler(euler).normalize().multiplyScalar(moveSpeed * delta);
                    camera.position.x += moveVec.x; camera.position.z += moveVec.z;

                    headBobTimer += delta * 12;
                    camera.position.y = 2.5 + Math.sin(headBobTimer) * 0.08;

                    const inHouseCurrent = (currentCycle !== 2 && camera.position.z < -37 && Math.abs(camera.position.x) < 8); const activeStep = inHouseCurrent ? sfx.house_steps : sfx.path_steps; const inactiveStep = inHouseCurrent ? sfx.path_steps : sfx.house_steps;
                    if (!inactiveStep.paused) { inactiveStep.pause(); inactiveStep.currentTime = 0; }
                    if (activeStep.paused || activeStep.ended) { activeStep.volume = masterVolume; activeStep.play().catch(e => console.log("Missing step audio")); }

                    if (currentCycle === 2 && !isDaytime) {
                        finalCycleWalkTime += delta; 
                        if (finalCycleWalkTime > 1.5 && !finalCycleFlags[0]) { showSubtitle("I've finally done killing those rabbit!", 4000); showRabbitHand(); finalCycleFlags[0] = true; }
                        if (finalCycleWalkTime > 12 && !finalCycleFlags[1]) { showSubtitle("Everyday is just a repeat cycle, I'm feel like a loser!", 4000); finalCycleFlags[1] = true; }
                        if (finalCycleWalkTime > 25 && !finalCycleFlags[2]) { showSubtitle("Hmmm, weird, I feels like the road is longer than usual?", 4000); finalCycleFlags[2] = true; }
                        if (finalCycleWalkTime > 40 && !finalCycleFlags[3]) { completeObjective(); finalCycleFlags[3] = true; triggerFinalJumpscare(); }
                    }
                } else {
                    if (sfx.house_steps && !sfx.house_steps.paused) { sfx.house_steps.pause(); sfx.house_steps.currentTime = 0; }
                    if (sfx.path_steps && !sfx.path_steps.paused) { sfx.path_steps.pause(); sfx.path_steps.currentTime = 0; }
                    if (!isWakingUp) camera.position.y = 2.5;
                }

                if (isNightmare && nightmareDoorOpened && !hasSeenBloodInNightmare && camera.position.z > -37.0) { hasSeenBloodInNightmare = true; showSubtitle("blood?", 2500); }
                if (isNightmare && nightmareDoorOpened && camera.position.z > -15 && !isNightmareChase) { triggerNightmareChaseSequence(); }
                if (isAmbientPlaying) { const targetVol = ((camera.position.z < -37 && Math.abs(camera.position.x) < 8) && currentCycle !== 2) ? masterVolume * 0.1 : masterVolume; sfx.ambient_bg.volume += (targetVol - sfx.ambient_bg.volume) * 0.05; }
                
                if (currentCycle !== 2 && camera.position.z > -36 && !isWhiteForest) { 
                    let isOffPath = false; if (camera.position.x > 4.5) { camera.position.x = 4.5; isOffPath = true; } else if (camera.position.x < -4.5) { camera.position.x = -4.5; isOffPath = true; }
                    if (isOffPath && !isDaytime && !isNightmare) showSubtitle("wrong way, i need to follow the path!", 2000);
                } 
                else if (currentCycle === 2 && !isWhiteForest) { if (camera.position.x > 4.5) { camera.position.x = 4.5; } else if (camera.position.x < -4.5) { camera.position.x = -4.5; } }
                if(camera.position.x > 90) camera.position.x = 90; if(camera.position.x < -90) camera.position.x = -90;
                
                if (isDaytime && camera.position.z > 45 && !isWhiteForest) { 
                    if (isAfternoon) {
                        camera.position.z = 45; showSubtitle("There's nothing to do out there right now, I should watch TV.", 3000);
                    } else if (!isFrozen) { 
                        completeObjective();
                        isFrozen = true; uiElems.fade.style.pointerEvents = 'auto'; uiElems.fade.style.opacity = 1; setTimeout(() => resetToNightTime(), 3000); 
                    } 
                } else if (!isDaytime && camera.position.z > 48) { camera.position.z = 48; showSubtitle("I shouldn't go back, I need to get home.", 2000); }
                
                if (isDaytime && camera.position.z > 0 && !morningTextTriggered && !isWhiteForest && !isAfternoon) { morningTextTriggered = true; showSubtitle("weird, why won any bird chirping anymore in the last couple days", 4000); }
                
                const isDoorOpen = doorMesh.userData.isOpen;
                if (currentCycle !== 2 && camera.position.z < -35 && camera.position.z > -55 && Math.abs(camera.position.x) < 9 && !isWhiteForest) {
                    if (!isDaytime && hasEnteredHouse && !isNightmare) { if (camera.position.z > -38.0) camera.position.z = -38.0; } else { if (camera.position.z < -36.5 && camera.position.z > -38.5) { if (Math.abs(camera.position.x) > 1.8) { camera.position.z = camera.position.z > -37.5 ? -36.5 : -38.5; } else if (!isDoorOpen) { camera.position.z = camera.position.z > -37.5 ? -36.5 : -38.5; } } }
                    if (camera.position.z <= -37.5) { if (camera.position.x > 7.0) camera.position.x = 7.0; if (camera.position.x < -7.0) camera.position.x = -7.0; if (camera.position.z < -52.0) camera.position.z = -52.0; }
                    if (camera.position.x > -7.5 && camera.position.x < -2.5 && camera.position.z > -53 && camera.position.z < -45) { const dRight = Math.abs(-2.5 - camera.position.x); const dFront = Math.abs(-45 - camera.position.z); if (dRight < dFront) camera.position.x = -2.5; else camera.position.z = -45; }
                    if (camera.position.x > -3.2 && camera.position.x < -0.8 && camera.position.z > -52.5 && camera.position.z < -50.5) { const dRight = Math.abs(-0.8 - camera.position.x); const dFront = Math.abs(-50.5 - camera.position.z); if (dRight < dFront) camera.position.x = -0.8; else camera.position.z = -50.5; }
                    if (camera.position.x > 1.0 && camera.position.x < 7.0 && camera.position.z > -53 && camera.position.z < -49.25) { const dLeft = Math.abs(camera.position.x - 1.0); const dRight = Math.abs(7.0 - camera.position.x); const dFront = Math.abs(camera.position.z - (-49.25)); const min = Math.min(dLeft, dRight, dFront); if (min === dLeft) camera.position.x = 1.0; else if (min === dRight) camera.position.x = 7.0; else camera.position.z = -49.25; }
                    if (camera.position.x > 4.0 && camera.position.x < 7.0 && camera.position.z > -42.5 && camera.position.z < -39.5) { const dLeft = Math.abs(camera.position.x - 4.0); const dBack = Math.abs(camera.position.z - (-42.5)); if (dLeft < dBack) camera.position.x = 4.0; else camera.position.z = -42.5; }
                }
                if (currentCycle !== 2 && !hasEnteredHouse && camera.position.z < -38 && Math.abs(camera.position.x) < 5 && !isWhiteForest) {
                    hasEnteredHouse = true; completeObjective(); hideRabbitHand(); if (doorMesh.userData.isOpen) { doorMesh.userData.isOpen = false; doorPivot.rotation.y = 0; playSound('door_close'); }
                    playSound('click'); if (currentCycle === 1) { if (isFlashlightOn) toggleFlashlight(); flashlightDead = true; showSubtitle("The door slammed shut and locked! I need to find the light button...", 4000); setTimeout(() => { updateObjective("Go to sleep"); }, 4000); }
                }
            } else { if (sfx.house_steps && !sfx.house_steps.paused) { sfx.house_steps.pause(); sfx.house_steps.currentTime = 0; } if (sfx.path_steps && !sfx.path_steps.paused) { sfx.path_steps.pause(); sfx.path_steps.currentTime = 0; } }

            if (shakeTimer > 0) { shakeTimer -= delta; camera.position.x = cameraBasePos.x + (Math.random() - 0.5) * 0.2; camera.position.y = cameraBasePos.y + (Math.random() - 0.5) * 0.2; if (shakeTimer <= 0) camera.position.copy(cameraBasePos); }
            renderer.render(scene, camera);
        }
        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth * pixelRatio, window.innerHeight * pixelRatio, false); });
        animate();
    </script>
