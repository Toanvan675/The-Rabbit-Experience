<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The rabbit Experience</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }

        #game-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
            image-rendering: pixelated; 
            image-rendering: crisp-edges; 
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
        }

        #crt-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 4;
            opacity: 0.6;
        }

        #rabbit-hand-overlay {
            position: absolute;
            top: 62%;
            left: 84%;
            transform: translate(-35%, -45%);
            width: 48vw;
            max-width: 550px;
            height: auto;
            z-index: 25;
            pointer-events: none;
            transition: opacity 0.6s ease-in-out;
            opacity: 0;
        }
        #rabbit-hand-overlay.visible {
            opacity: 1 !important;
        }
        #rabbit-hand-overlay img {
            width: 100%;
            height: auto;
            display: block;
            mix-blend-mode: screen;
            filter: drop-shadow(-5px -5px 15px rgba(0,0,0,0.8));
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: transparent;
            color: #fff;
            text-align: center;
        }
        
        .menu-bg {
            background-color: rgba(0, 0, 0, 0.85); 
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .hidden { display: none !important; }

        @keyframes flicker {
            0% { opacity: 1; text-shadow: 3px 3px 0 #500000; }
            5% { opacity: 0.2; text-shadow: none; }
            10% { opacity: 1; text-shadow: 3px 3px 0 #500000; }
            15% { opacity: 0.1; }
            25% { opacity: 1; text-shadow: 3px 3px 0 #500000; }
            80% { opacity: 1; text-shadow: 3px 3px 0 #500000; }
            82% { opacity: 0.5; }
            84% { opacity: 1; text-shadow: 3px 3px 0 #500000; }
            100% { opacity: 1; text-shadow: 3px 3px 0 #500000; }
        }
        
        @keyframes fast-flicker {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
        }

        @keyframes blink-slow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        .blinking { animation: blink-slow 1.2s infinite; }

        h1 {
            font-size: 4rem;
            color: #cc0000;
            margin-bottom: 50px;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: flicker 4s infinite;
        }

        button {
            background: rgba(0,0,0,0.5);
            border: 2px solid #fff;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
        }

        button:hover { background-color: #fff; color: #000; }

        #main-menu button {
            color: #cc0000;
            border-color: #cc0000;
            background: rgba(20, 0, 0, 0.6);
        }
        #main-menu button:hover {
            background-color: #cc0000;
            color: #000;
        }

        .menu-btns-vertical { 
            display: flex; 
            flex-direction: column; 
            gap: 20px; 
            align-items: center;
        }
        
        .menu-btns-vertical button {
            font-size: 1.5rem;
            padding: 15px 40px;
            width: 250px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(204, 0, 0, 0.2);
        }

        #btn-play {
            font-size: 2.5rem !important;
            padding: 15px 60px !important;
            margin-bottom: 15px;
            width: 300px !important;
        }

        .menu-btns button {
            font-size: 1.2rem;
            padding: 12px 20px;
            width: 180px; 
            margin: 10px;
        }

        .info-panel {
            background: rgba(10,10,10,0.95);
            border: 1px solid #555;
            padding: 40px;
            width: 450px;
            margin-bottom: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,1);
        }

        #btn-ingame-menu {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 2.5rem;
            padding: 5px 15px;
            z-index: 5;
            background: rgba(0,0,0,0.6);
            border: 2px solid #555;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        #btn-ingame-menu:hover {
            background: rgba(200,0,0,0.8);
            border-color: #f00;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            font-size: 1.2rem;
        }
        
        .setting-row input[type="range"] {
            width: 200px;
            cursor: pointer;
        }

        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 6px; height: 6px;
            background-color: rgba(255, 255, 255, 0.8);
            transform: translate(-50%, -50%);
            z-index: 5;
            border-radius: 50%;
            transition: all 0.2s ease-in-out;
            pointer-events: none;
        }

        #crosshair.glow {
            width: 8px; height: 8px;
            background-color: #ff3333; 
            box-shadow: 0 0 15px #ff0000, 0 0 5px #ff0000;
        }

        #flashlight-ui {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px; height: 70px;
            background-color: rgba(0, 0, 0, 0.5);
            border: 2px solid #888;
            border-radius: 10px;
            z-index: 5;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            transition: all 0.2s;
        }
        
        #flashlight-ui.active {
            background-color: rgba(255, 255, 200, 0.6);
            border-color: #fff;
            box-shadow: 0 0 20px rgba(255, 255, 200, 0.5);
        }

        #instructions {
            position: absolute;
            top: 20px; right: 20px;
            color: rgba(255,255,255,0.6);
            z-index: 5; font-size: 1rem;
            pointer-events: none;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-right: 3px solid #fff;
            text-align: right;
            transition: opacity 2s ease-in-out;
            opacity: 1;
        }

        #subtitle {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 1.5rem;
            text-shadow: 2px 2px 4px #000;
            z-index: 6;
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            max-width: 80%;
            white-space: pre-wrap; 
        }

        #fade-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: black;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            transition: opacity 3s ease-in-out, background-color 1s;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 3rem;
            font-weight: bold;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        .shaking { animation: shake 0.1s infinite; }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div id="crt-overlay"></div>
    <div id="fade-overlay"><span id="end-text"></span></div>

    <!-- HUD -->
    <div id="hud" class="hidden">
        <button id="btn-ingame-menu">⚙️</button>
        <div id="crosshair"></div>
        <div id="flashlight-ui">🔦</div>
        <div id="subtitle"></div>
        <div id="rabbit-hand-overlay">
            <img src="Hand.jpg" onerror="this.onerror=null; this.src='https://placehold.co/400x300/111/f00?text=Hand.jpg+Missing';" alt="Holding Rabbit">
        </div>
        <div id="instructions">
            [W,A,S,D] Move<br>
            [Leftclick] Interact<br>
            [1] Flashlight<br>
            [ESC] Menu
        </div>
    </div>

    <!-- Main Menu -->
    <div id="main-menu" class="ui-layer">
        <div class="menu-bg"></div>
        <h1 style="position: relative; z-index: 2;">The Rabbit Experience</h1>
        <div class="menu-btns-vertical" style="position: relative; z-index: 2;">
            <button id="btn-play">PLAY</button>
            <button id="btn-credit">CREDITS</button>
            <button id="btn-donate">DONATE</button>
        </div>
    </div>

    <!-- Pause Menu (In-game) -->
    <div id="pause-menu" class="ui-layer hidden" style="z-index: 15;">
        <div class="menu-bg"></div>
        <h2 style="font-size: 3rem; margin-bottom: 30px;">PAUSED</h2>
        <div class="menu-btns" style="display:flex; flex-direction:column;">
            <button id="btn-resume" style="border-color:#aaa;">CONTINUE</button>
            <button id="btn-settings">SETTINGS</button>
            <button id="btn-quit-main">MAIN MENU</button>
        </div>
    </div>

    <!-- Settings Menu -->
    <div id="settings-menu" class="ui-layer hidden" style="z-index: 16;">
        <div class="menu-bg"></div>
        <div class="info-panel">
            <h2>SETTINGS</h2>
            <div class="setting-row">
                <label>Volume:</label>
                <input type="range" id="vol-slider" min="0" max="1" step="0.1" value="1">
            </div>
            <div class="setting-row">
                <label>FOV:</label>
                <input type="range" id="fov-slider" min="50" max="100" step="5" value="65">
            </div>
        </div>
        <button id="btn-settings-back" class="btn-back">QUAY LẠI</button>
    </div>

    <!-- Credit Menu -->
    <div id="credit-menu" class="ui-layer hidden">
        <div class="menu-bg"></div>
        <div class="info-panel">
            <h2>CREDITS</h2>
            <p style="font-size: 1.2rem; color: #aaa;">"Toàn đẹp trai" made this shit</p>
        </div>
        <button class="btn-back">BACK</button>
    </div>

    <!-- Donate Menu -->
    <div id="donate-menu" class="ui-layer hidden">
        <div class="menu-bg"></div>
        <div class="info-panel">
            <h2>DONATE</h2>
            <p>[ SCAN TO SUPPORT ]</p>
            <img src="image_cad759.jpg" onerror="this.onerror=null; this.src='https://placehold.co/300x400/111/f00?text=QR+Code+Missing';" alt="QR Donate" style="width: 300px; max-width: 100%; height: auto; margin: 0 auto; display: block; border: 4px solid #333; border-radius: 10px;">
        </div>
        <button class="btn-back">BACK</button>
    </div>

    <script>
        const uiElems = {
            main: document.getElementById('main-menu'),
            pause: document.getElementById('pause-menu'),
            settings: document.getElementById('settings-menu'),
            credit: document.getElementById('credit-menu'),
            donate: document.getElementById('donate-menu'),
            hud: document.getElementById('hud'),
            subtitle: document.getElementById('subtitle'),
            fade: document.getElementById('fade-overlay'),
            endText: document.getElementById('end-text'),
            ingameMenuBtn: document.getElementById('btn-ingame-menu'),
            crosshair: document.getElementById('crosshair'),
            rabbitHand: document.getElementById('rabbit-hand-overlay')
        };
        const flashlightBtn = document.getElementById('flashlight-ui');

        // GAME STATE VARIABLES
        let currentCycle = 1;
        let morningTextTriggered = false;
        let hasTurnedOnLight = false;
        let isDaytime = false;
        let hasScared = false;
        let hasEnteredHouse = false;
        let isFlashlightOn = false;
        let flashlightDead = false;
        
        let finalCycleWalkTime = 0;
        let finalCycleFlags = [false, false, false, false];
        let isFinalJumpscare = false; 
        let finalScareBasePos = new THREE.Vector3(); 
        let isPaused = false;
        let shakeTimer = 0;
        let cameraBasePos = new THREE.Vector3();

        // NIGHTMARE VARIABLES
        let isNightmare = false;
        let nightmareDoorOpened = false;
        let knockingInterval = null;

        function showRabbitHand() { uiElems.rabbitHand.classList.add('visible'); }
        function hideRabbitHand() { uiElems.rabbitHand.classList.remove('visible'); }

        document.getElementById('btn-credit').addEventListener('click', () => { uiElems.main.classList.add('hidden'); uiElems.credit.classList.remove('hidden'); });
        document.getElementById('btn-donate').addEventListener('click', () => { uiElems.main.classList.add('hidden'); uiElems.donate.classList.remove('hidden'); });
        
        document.querySelectorAll('#credit-menu .btn-back, #donate-menu .btn-back').forEach(btn => btn.addEventListener('click', () => {
            uiElems.credit.classList.add('hidden');
            uiElems.donate.classList.add('hidden');
            uiElems.main.classList.remove('hidden');
        }));

        uiElems.ingameMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            document.exitPointerLock();
            uiElems.pause.classList.remove('hidden');
            uiElems.ingameMenuBtn.classList.add('hidden');
        });

        document.getElementById('btn-resume').addEventListener('click', () => {
            uiElems.pause.classList.add('hidden');
            document.body.requestPointerLock();
        });

        document.getElementById('btn-settings').addEventListener('click', () => {
            uiElems.pause.classList.add('hidden');
            uiElems.settings.classList.remove('hidden');
        });

        document.getElementById('btn-settings-back').addEventListener('click', () => {
            uiElems.settings.classList.add('hidden');
            uiElems.pause.classList.remove('hidden');
        });

        document.getElementById('btn-quit-main').addEventListener('click', () => {
            location.reload(); 
        });

        const volSlider = document.getElementById('vol-slider');
        const fovSlider = document.getElementById('fov-slider');
        let masterVolume = 1.0;

        const sfx = {
            path_steps: new Audio('musics/path_steps.mp3'),
            house_steps: new Audio('musics/house_steps.mp3'),
            flashlight_on: new Audio('musics/flashlight_on.mp3'),
            flashlight_off: new Audio('musics/flashlight_off.mp3'),
            door_open: new Audio('musics/door_open.mp3'),
            door_close: new Audio('musics/door_close.mp3'),
            ambient_bg: new Audio('musics/ambient_bg.mp3'),
            jumpscare_1: new Audio('musics/jumpscare_1.mp3'),
            jumpscare_final: new Audio('musics/jumpscare_final.mp3'),
            rain: new Audio('musics/rain.mp3'),
            knock: new Audio('musics/knock.mp3'),
            player_hit: new Audio('musics/player_hit.mp3')
        };
        sfx.ambient_bg.loop = true;
        sfx.jumpscare_final.loop = true;
        sfx.rain.loop = true;
        sfx.knock.loop = true;

        volSlider.addEventListener('input', (e) => {
            masterVolume = parseFloat(e.target.value);
            if (masterGain) masterGain.gain.value = masterVolume;
            
            if (isAmbientPlaying && sfx.ambient_bg) {
                const inHouseCurrent = (camera && camera.position.z < -37 && Math.abs(camera.position.x) < 8);
                sfx.ambient_bg.volume = (inHouseCurrent && currentCycle !== 2) ? masterVolume * 0.1 : masterVolume;
            }
            if (sfx.jumpscare_final) sfx.jumpscare_final.volume = masterVolume;
            if (sfx.path_steps) sfx.path_steps.volume = masterVolume;
            if (sfx.house_steps) sfx.house_steps.volume = masterVolume;
            if (sfx.rain) sfx.rain.volume = masterVolume;
            if (sfx.knock) sfx.knock.volume = masterVolume;
        });

        let audioCtx;
        let masterGain;
        let noiseBuffer;
        let isAmbientPlaying = false;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                
                masterGain = audioCtx.createGain();
                masterGain.gain.value = masterVolume;
                masterGain.connect(audioCtx.destination);

                const bufferSize = audioCtx.sampleRate * 0.2; 
                noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playContinuousJumpscare() {
            if (sfx.jumpscare_final) {
                sfx.jumpscare_final.volume = masterVolume;
                sfx.jumpscare_final.currentTime = 0;
                sfx.jumpscare_final.play().catch(e => console.log("Missing jumpscare_final.mp3"));
            }
        }

        function playSound(type) {
            if (!audioCtx) return;

            if (sfx[type]) {
                let sound = sfx[type];
                if (['door_open', 'door_close', 'flashlight_on', 'flashlight_off', 'jumpscare_1', 'player_hit'].includes(type)) {
                    sound = sound.cloneNode();
                }
                sound.volume = masterVolume;
                sound.play().catch(e => {
                    playSynthFallback(type);
                });
                return;
            }
            playSynthFallback(type);
        }

        function playSynthFallback(type) {
            const t = audioCtx.currentTime;
            if (type === 'ui_blip') {
                const noiseSource = audioCtx.createBufferSource();
                noiseSource.buffer = noiseBuffer;
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass'; filter.frequency.value = 400; 
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.5, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.15);
                noiseSource.connect(filter); filter.connect(gain); gain.connect(masterGain);
                noiseSource.start();
            } 
            else if (type === 'wood_step') {
                const osc = audioCtx.createOscillator(); osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, t); osc.frequency.exponentialRampToValueAtTime(50, t + 0.1);
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.4, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
                osc.connect(gain); gain.connect(masterGain);
                osc.start(t); osc.stop(t + 0.1);
            }
            else if (type === 'click') {
                const osc = audioCtx.createOscillator(); osc.type = 'square';
                osc.frequency.setValueAtTime(800, t);
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.05);
                osc.connect(gain); gain.connect(masterGain);
                osc.start(t); osc.stop(t + 0.05);
            }
            else if (type === 'door') {
                const osc = audioCtx.createOscillator(); osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, t); osc.frequency.linearRampToValueAtTime(60, t + 0.4);
                const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 800;
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.5, t); gain.gain.linearRampToValueAtTime(0.01, t + 0.4);
                osc.connect(filter); filter.connect(gain); gain.connect(masterGain);
                osc.start(t); osc.stop(t + 0.4);
            }
            else if (type === 'jumpscare') {
                const osc = audioCtx.createOscillator(); osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, t); osc.frequency.exponentialRampToValueAtTime(20, t + 1.5);
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(3, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 1.5);
                osc.connect(gain); gain.connect(masterGain);
                osc.start(); osc.stop(t + 1.5);
            }
            else if (type === 'thunder') {
                const bufferSize = audioCtx.sampleRate * 3.0; 
                const thunderBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = thunderBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;
                const noiseSource = audioCtx.createBufferSource(); noiseSource.buffer = thunderBuffer;
                
                const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1000, t); filter.frequency.exponentialRampToValueAtTime(50, t + 3);
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(1.5, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 3);
                
                noiseSource.connect(filter); filter.connect(gain); gain.connect(masterGain);
                noiseSource.start(t);
            }
            else if (type === 'typewriter') {
                const osc = audioCtx.createOscillator(); osc.type = 'square';
                osc.frequency.setValueAtTime(600 + Math.random() * 200, t); 
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.015, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
                osc.connect(gain); gain.connect(masterGain);
                osc.start(t); osc.stop(t + 0.04);
            }
            else if (type === 'knock_synth') {
                const osc = audioCtx.createOscillator(); osc.type = 'triangle';
                osc.frequency.setValueAtTime(80, t);
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(1.5, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
                osc.connect(gain); gain.connect(masterGain);
                osc.start(t); osc.stop(t + 0.1);
            }
            else if (type === 'player_hit') {
                const osc = audioCtx.createOscillator(); osc.type = 'square';
                osc.frequency.setValueAtTime(120, t); osc.frequency.exponentialRampToValueAtTime(10, t + 0.3);
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(2.0, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
                osc.connect(gain); gain.connect(masterGain);
                osc.start(t); osc.stop(t + 0.3);
                
                const noiseSource = audioCtx.createBufferSource(); noiseSource.buffer = noiseBuffer;
                const noiseGain = audioCtx.createGain();
                noiseGain.gain.setValueAtTime(1.5, t); noiseGain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);

            return new Promise((resolve) => {
                clearInterval(typingInterval);
                clearTimeout(hideTimeout);
                
                uiElems.subtitle.textContent = ""; 
                uiElems.subtitle.style.opacity = 1;
                
                let i = 0;
                typingInterval = setInterval(() => {
                    if (i < text.length) {
                        uiElems.subtitle.textContent += text.charAt(i);
                        if (text.charAt(i) !== ' ' && text.charAt(i) !== '\u00A0') playSound('typewriter');
                        i++;
                    } else {
                        clearInterval(typingInterval);
                        if (duration > 0) {
                            hideTimeout = setTimeout(() => {
                                hideSubtitle();
                                resolve();
                            }, duration);
                        } else {
                            resolve();
                        }
                    }
                }, TYPE_SPEED);
            });

            if(e.code === 'KeyA' || e.code === 'ArrowLeft') keys.a = true;
            if(e.code === 'KeyS' || e.code === 'ArrowDown') keys.s = true;
            if(e.code === 'KeyD' || e.code === 'ArrowRight') keys.d = true;
            if(e.code === 'Digit1' && controlsEnabled && !isFrozen) toggleFlashlight();
        });
        document.addEventListener('keyup', (e) => {
            if(e.code === 'KeyW' || e.code === 'ArrowUp') keys.w = false;
            if(e.code === 'KeyA' || e.code === 'ArrowLeft') keys.a = false;
            if(e.code === 'KeyS' || e.code === 'ArrowDown') keys.s = false;
            if(e.code === 'KeyD' || e.code === 'ArrowRight') keys.d = false;
        });

        function triggerWakeUp(fromNightmare = false) {
            uiElems.endText.classList.remove('blinking');
            uiElems.endText.textContent = "";
            hideSubtitle(); 
            
            scene.background.setHex(0x87CEEB); 
            scene.fog.color.setHex(0x87CEEB);
            scene.fog.density = 0.025; 
            
            if (!sunLight) {
                sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
                sunLight.position.set(10, 20, 10);
                scene.add(sunLight);
            }
            sunLight.intensity = 1.2;
            ambientLight.intensity = 0.5;
            
            flashlightDead = false; 
            isDaytime = true;
            
            updateClockTime("5:00 AM");

            if (isFlashlightOn) toggleFlashlight(); 
            
            uiElems.fade.style.opacity = 0;
            
            setTimeout(async () => { 
                isFrozen = false; 
                if (fromNightmare) {
                    await showSubtitle("So that was a weird dream", 3500);
                }
                await showSubtitle("It's morning, I have some more work to do!", 2000);
                showSubtitle("I need to get out and walk on the path to go there!", 4000);
            }, 3000); 
        }

        function triggerNightmare() {
            isNightmare = true;
            flashlightDead = false; // Cho phép sử dụng lại đèn pin
            uiElems.endText.classList.remove('blinking');
            uiElems.endText.textContent = "";
            
            updateClockTime("3:00 AM");
            
            camera.position.set(-4, 2.5, -45); 
            pitch = 0; yaw = 0; 
            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));

            if (sfx.knock) {
                sfx.knock.volume = masterVolume;
                sfx.knock.play().catch(e => {
                    knockingInterval = setInterval(() => playSound('knock_synth'), 400);
                });
            }

            uiElems.fade.style.opacity = 0;
            setTimeout(() => { 
                isFrozen = false; 
                showSubtitle("Who's knocking...? Let's see if my flashlight works.", 4000);
            }, 2000);
        }

        function generateBloodPath() {
            const bloodMat = new THREE.MeshLambertMaterial({ 
                color: 0x660000, 
                transparent: true, 
                opacity: 0.85 
            });
            for (let i = 0; i < 40; i++) {
                const size = 0.2 + Math.random() * 0.4;
                const drop = new THREE.Mesh(new THREE.CylinderGeometry(size, size, 0.05, 16), bloodMat);
                
                const zPos = -34 + (i * 0.9) + (Math.random() - 0.5); 
                const xPos = (Math.random() - 0.5) * 3; 
                
                drop.position.set(xPos, 0.05, zPos);
                bloodGroup.add(drop);
            }
        }

        function triggerNightmareHit() {
            isFrozen = true;
            playSound('player_hit');
            
            uiElems.fade.style.transition = "opacity 0.1s";
            uiElems.fade.style.opacity = 1;
            
            setTimeout(() => { uiElems.fade.style.opacity = 0; }, 100);
            setTimeout(() => { uiElems.fade.style.opacity = 1; }, 250);
            setTimeout(() => { uiElems.fade.style.opacity = 0; }, 400);
            
            setTimeout(() => { 
                uiElems.fade.style.transition = "opacity 2s"; 
                uiElems.fade.style.opacity = 1; 
                
                setTimeout(() => {
                    isNightmare = false;
                    nightmareDoorOpened = false;
                    
                    while(bloodGroup.children.length > 0) { 
                        bloodGroup.remove(bloodGroup.children[0]); 
                    }
                    
                    doorMesh.userData.isOpen = false;
                    doorPivot.rotation.y = 0;
                    
                    camera.position.set(-4, 2.5, -45); 
                    pitch = 0; yaw = 0;
                    camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
                    
                    triggerWakeUp(true); 
                }, 2000);
            }, 600);
        }

        function resetToNightTime() {
            scene.background.setHex(0x000000);
            scene.fog.color.setHex(0x000000);
            scene.fog.density = 0.08;
            if (sunLight) sunLight.intensity = 0;
            ambientLight.intensity = 0;
            
            isDaytime = false;
            hasEnteredHouse = false;
            hasTurnedOnLight = false;
            hasScared = false; 
            morningTextTriggered = false; 
            currentCycle++; 

            if (currentCycle === 2) {
                houseGroup.visible = false;
                hideRabbitHand(); 
            }
            
            switchBtn.userData.isOn = false;
            switchBtn.material.color.setHex(0xaaaaaa);
            switchBtn.material.emissive.setHex(0x0055ff);
            houseLight.intensity = 0;
            
            doorMesh.userData.isOpen = false;
            doorPivot.rotation.y = 0;
            
            camera.position.set(0, 2, 45);
            pitch = 0; yaw = 0;
            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
            
            uiElems.fade.style.opacity = 0;
            setTimeout(() => { isFrozen = false; }, 3000);
        }

        const raycaster = new THREE.Raycaster();
        document.addEventListener('mousedown', (e) => {
            if (e.button === 0 && controlsEnabled && !isFrozen) {
                
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const intersects = raycaster.intersectObjects(interactables);
                
                if (currentCycle !== 2 && intersects.length > 0 && intersects[0].distance < 6) {
                    const obj = intersects[0].object;
                    const type = obj.userData.type;

                    if (isDaytime && type !== 'door') return;
                    if (isNightmare && type !== 'door') return; 

                    if (type === 'door') {
                        if (isNightmare) {
                            if (!nightmareDoorOpened) {
                                nightmareDoorOpened = true;
                                if (sfx.knock) sfx.knock.pause();
                                if (knockingInterval) clearInterval(knockingInterval);
                                
                                obj.userData.isOpen = true;
                                playSound('door_open');
                                doorPivot.rotation.y = Math.PI / 2;
                                
                                generateBloodPath();
                            }
                        }
                        else if (!isDaytime && hasEnteredHouse) {
                            playSound('door_close'); 
                            showSubtitle("I locked the door, no need to get out at night!.", 3000);
                            return;
                        } else {
                            obj.userData.isOpen = !obj.userData.isOpen;
                            playSound(obj.userData.isOpen ? 'door_open' : 'door_close');
                            doorPivot.rotation.y = obj.userData.isOpen ? Math.PI / 2 : 0; 
                        }
                    } 
                    else if (type === 'switch') {
                        playSound('click');
                        obj.userData.isOn = true; 
                        hasTurnedOnLight = true;
                        houseLight.intensity = 1.2;
                        obj.material.color.setHex(0x00ff00);
                        obj.material.emissive.setHex(0x000000); 

                        if (currentCycle === 1) {
                            showSubtitle("I'm tired, better get some sleep!", 0);
                        }
                    }
                    else if (type === 'bed') {
                        if (!hasTurnedOnLight) {
                            showSubtitle("I need to find the light switch first...", 3000);
                        } else {
                            if (!isFrozen) { 
                                isFrozen = true; 
                                hideSubtitle(); 
                                uiElems.fade.style.opacity = 1;
                                
                                setTimeout(() => {
                                    uiElems.endText.textContent = "Zzz...";
                                    uiElems.endText.classList.add('blinking');
                                    
                                    setTimeout(() => {
                                        if (currentCycle === 1 && !isNightmare && !isDaytime) {
                                            triggerNightmare();
                                        } else {
                                            triggerWakeUp();
                                        }
                                    }, 5000);
                                }, 3000); 
                            }
                        }
                    }
                    else if (type === 'tv') {
                        playSound('click'); 
                        showSubtitle("I don't wanna use the tv rightnow", 3000);
                    }
                }
            }
        });

        function triggerJumpscare() {
            hasScared = true; 
            isFrozen = true;

            if (roadRabbitGroup) {
                roadRabbitGroup.visible = false;
            }

            cameraBasePos.copy(camera.position);

            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const downVec = new THREE.Vector3(0, -1, 0).applyQuaternion(camera.quaternion);
            
            rabbitGroup.position.copy(camera.position)
                .add(dir.multiplyScalar(1.5))
                .add(downVec.multiplyScalar(0.72)); 
                
            rabbitGroup.quaternion.copy(camera.quaternion);
            
            rabbitLight.position.set(0, 1.3, 2.5); rabbitLight.intensity = 6; 
            shakeTimer = 3.0; 
            document.body.classList.add('shaking'); 
            playSound('jumpscare_1');

            setTimeout(() => {
                document.body.classList.remove('shaking'); 
                rabbitGroup.position.y = -10; 
                rabbitLight.intensity = 0; 
                camera.position.copy(cameraBasePos);
                isFrozen = false; 
                showSubtitle("oh, just a stupid rabbit, really creeped me out!", 4000);
            }, 3000);
        }

        function triggerFinalJumpscare() {
            isFrozen = true;
            isFinalJumpscare = true; 

            if (isAmbientPlaying) {
                sfx.ambient_bg.pause();
                sfx.ambient_bg.currentTime = 0;
                isAmbientPlaying = false;
            }
            if (sfx.path_steps && !sfx.path_steps.paused) sfx.path_steps.pause();
            if (sfx.house_steps && !sfx.house_steps.paused) sfx.house_steps.pause();
            if (sfx.rain && !sfx.rain.paused) sfx.rain.pause();
            
            hideRabbitHand();

            scene.fog.density = 0;
            rMat.emissive.setHex(0x444444);

            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const downVec = new THREE.Vector3(0, -1, 0).applyQuaternion(camera.quaternion);
            
            const SCALE = 6.5; 
            rabbitGroup.scale.set(SCALE, SCALE, SCALE); 
            
            const dist = 1.25 * SCALE + 2.5;
            
            rabbitGroup.position.copy(camera.position)
                .add(dir.multiplyScalar(dist))
                .add(downVec.multiplyScalar(1.1 * SCALE));
                
            rabbitGroup.quaternion.copy(camera.quaternion);

            finalScareBasePos.copy(rabbitGroup.position);
            
            rabbitLight.position.set(0, 1.5, 1.5); 
            rabbitLight.intensity = 50; 
            
            document.body.classList.add('shaking'); 
            playContinuousJumpscare();

            setTimeout(() => {
                uiElems.fade.style.pointerEvents = 'auto'; 
                uiElems.fade.style.opacity = 1;
                uiElems.fade.style.backgroundColor = 'rgba(30, 0, 0, 0.2)';
                
                uiElems.fade.innerHTML = `
                    <div style="display:flex; flex-direction:column; align-items:center; z-index: 999; position: relative;">
                        <span style="color:#ff0000; font-size:6rem; margin-bottom: 20px; text-shadow: 0 0 20px #ff0000, 4px 4px 0 #000; font-weight:bold; animation: fast-flicker 0.1s infinite;">GAME OVER</span>
                        <button id="btn-final-menu" style="font-size:2.5rem; padding:15px 40px; font-family: 'Courier New', monospace; background: rgba(0,0,0,0.8); color: #f00; border: 4px solid #f00; cursor: pointer; transition: all 0.3s; font-weight:bold;">MAIN MENU</button>
                    </div>
                `;
                
                document.exitPointerLock();
                const btnFinal = document.getElementById('btn-final-menu');
                btnFinal.addEventListener('mouseover', (e) => {
                    e.target.style.background = '#f00';
                    e.target.style.color = '#000';
                    e.target.style.boxShadow = '0 0 30px #f00';
                });
                btnFinal.addEventListener('mouseout', (e) => {
                    e.target.style.background = 'rgba(0,0,0,0.8)';
                    e.target.style.color = '#f00';
                    e.target.style.boxShadow = 'none';
                });
                
                btnFinal.addEventListener('click', () => {
                    location.reload();
                });
            }, 1000); 
        }

        const clock = new THREE.Clock();
        let lightningTimer = Math.random() * 2 + 0.5;

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();

            if (isPaused) {
                renderer.render(scene, camera);
                return;
            }

            if (isFinalJumpscare) {
                rabbitGroup.position.x = finalScareBasePos.x + (Math.random() - 0.5) * 0.3;
                rabbitGroup.position.y = finalScareBasePos.y + (Math.random() - 0.5) * 0.3;
                rabbitGroup.position.z = finalScareBasePos.z + (Math.random() - 0.5) * 0.3;
                
                const s = 6.5 + (Math.random() - 0.5) * 0.3;
                rabbitGroup.scale.set(s, s, s);

                rabbitLight.intensity = 40 + Math.random() * 30;
                eyeMat.color.setHex(Math.random() > 0.3 ? 0xff0000 : 0x770000);
            }

            // Mưa sấm chớp
            if (currentCycle === 2 && !isDaytime && !isPaused) {
                if (sfx.rain && sfx.rain.paused && !isFinalJumpscare) {
                    sfx.rain.volume = masterVolume;
                    sfx.rain.play().catch(e => console.log("Missing rain.mp3"));
                }
                rainDrop.visible = true;
                const pos = rainDrop.geometry.attributes.position.array;
                for(let i = 1; i < rainCount * 3; i += 3) {
                    pos[i] -= 30 * delta; 
                    if (pos[i] < 0) pos[i] = 40; 
                }
                rainDrop.geometry.attributes.position.needsUpdate = true;

                if (!isFinalJumpscare) {
                    lightningTimer -= delta;
                    if (lightningTimer <= 0) {
                        scene.background.setHex(0xffffff);
                        scene.fog.color.setHex(0xffffff);
                        
                        setTimeout(() => { scene.background.setHex(0x111111); scene.fog.color.setHex(0x111111); }, 50);
                        setTimeout(() => { scene.background.setHex(0xffffff); scene.fog.color.setHex(0xffffff); }, 100);
                        setTimeout(() => { scene.background.setHex(0x000000); scene.fog.color.setHex(0x000000); }, 150);
                        
                        playSound('thunder');
                        lightningTimer = Math.random() * 5 + 3; 
                    }
                }
            } else {
                rainDrop.visible = false; 
                if (sfx.rain && !sfx.rain.paused) { sfx.rain.pause(); }
            }
            
            // Chớp ngoài menu
            if (currentCycle !== 2 && !isDaytime && !controlsEnabled && uiElems.main.classList.contains('hidden') === false) {
                lightningTimer -= delta;
                if (lightningTimer <= 0) {
                    scene.background.setHex(0xffffff);
                    setTimeout(() => scene.background.setHex(0x111111), 50);
                    setTimeout(() => scene.background.setHex(0xffffff), 100);
                    setTimeout(() => scene.background.setHex(0x000000), 150);
                    lightningTimer = Math.random() * 1.5 + 0.5; 
                }
            }

            if (controlsEnabled && !isFrozen) {
                
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const intersects = raycaster.intersectObjects(interactables);
                
                let isHoveringInteractable = false;
                if (currentCycle !== 2 && intersects.length > 0 && intersects[0].distance < 6) {
                    const type = intersects[0].object.userData.type;
                    if (!isDaytime || type === 'door') {
                        isHoveringInteractable = true;
                    }
                }

                if (isHoveringInteractable) {
                    uiElems.crosshair.classList.add('glow');
                } else {
                    uiElems.crosshair.classList.remove('glow');
                }

                const dir = new THREE.Vector3();
                dir.z = Number(keys.w) - Number(keys.s);
                dir.x = Number(keys.d) - Number(keys.a);
                dir.normalize(); 

                const isMoving = (keys.w || keys.a || keys.s || keys.d) && dir.length() > 0;
                
                if (isMoving) {
                    const euler = new THREE.Euler(0, yaw, 0, 'YXZ');
                    const moveVec = new THREE.Vector3(dir.x, 0, -dir.z).applyEuler(euler).normalize().multiplyScalar(moveSpeed * delta);
                    
                    let nextX = camera.position.x + moveVec.x;
                    let nextZ = camera.position.z + moveVec.z;
                    
                    camera.position.x = nextX;
                    camera.position.z = nextZ;

                    const inHouseCurrent = (currentCycle !== 2 && camera.position.z < -37 && Math.abs(camera.position.x) < 8);
                    const activeStep = inHouseCurrent ? sfx.house_steps : sfx.path_steps;
                    const inactiveStep = inHouseCurrent ? sfx.path_steps : sfx.house_steps;

                    if (!inactiveStep.paused) {
                        inactiveStep.pause();
                        inactiveStep.currentTime = 0;
                    }

                    if (activeStep.paused || activeStep.ended) {
                        activeStep.volume = masterVolume;
                        activeStep.play().catch(e => console.log("Missing step audio"));
                    }

                    if (currentCycle === 2 && !isDaytime) {
                        finalCycleWalkTime += delta; 
                        
                        if (finalCycleWalkTime > 1.5 && !finalCycleFlags[0]) {
                            showSubtitle("i finally done killing those rabbit, i fuckin hate this job", 4000);
                            showRabbitHand(); 
                            finalCycleFlags[0] = true;
                        }
                        if (finalCycleWalkTime > 12 && !finalCycleFlags[1]) {
                            showSubtitle("Everyday is just a repeat cycle, I'm such a loser!", 4000);
                            finalCycleFlags[1] = true;
                        }
                        if (finalCycleWalkTime > 25 && !finalCycleFlags[2]) {
                            showSubtitle("WTF where is my house> why is the path so fuckin long???", 4000);
                            finalCycleFlags[2] = true;
                        }
                        if (finalCycleWalkTime > 40 && !finalCycleFlags[3]) {
                            finalCycleFlags[3] = true;
                            triggerFinalJumpscare();
                        }
                    }
                } else {
                    if (sfx.house_steps && !sfx.house_steps.paused) {
                        sfx.house_steps.pause();
                        sfx.house_steps.currentTime = 0;
                    }
                    if (sfx.path_steps && !sfx.path_steps.paused) {
                        sfx.path_steps.pause();
                        sfx.path_steps.currentTime = 0;
                    }
                }

                // CHECK NIGHTMARE HIT
                if (isNightmare && nightmareDoorOpened && camera.position.z > -15) {
                    triggerNightmareHit();
                }

                const inHouseCurrent = (camera.position.z < -37 && Math.abs(camera.position.x) < 8);
                if (isAmbientPlaying) {
                    const targetVol = (inHouseCurrent && currentCycle !== 2) ? masterVolume * 0.1 : masterVolume; 
                    sfx.ambient_bg.volume += (targetVol - sfx.ambient_bg.volume) * 0.05; 
                }

                camera.position.y = 2.5; 
                
                if (currentCycle !== 2 && camera.position.z > -36) { 
                    let isOffPath = false;
                    if (camera.position.x > 4.5) { camera.position.x = 4.5; isOffPath = true; }
                    else if (camera.position.x < -4.5) { camera.position.x = -4.5; isOffPath = true; }
                    
                    if (isOffPath && !isDaytime && !isNightmare) showSubtitle("wrong way, i need to follow the path!", 2000);
                } 
                else if (currentCycle === 2) {
                    if (camera.position.x > 4.5) { camera.position.x = 4.5; }
                    else if (camera.position.x < -4.5) { camera.position.x = -4.5; }
                }

                if(camera.position.x > 90) camera.position.x = 90;
                if(camera.position.x < -90) camera.position.x = -90;
                
                if (isDaytime && camera.position.z > 45) {
                    if (!isFrozen) {
                        isFrozen = true;
                        uiElems.fade.style.opacity = 1;
                        setTimeout(() => resetToNightTime(), 3000);
                    }
                } else if (!isDaytime && camera.position.z > 48) {
                    camera.position.z = 48;
                    showSubtitle("I shouldn't go back, I need to get home.", 2000);
                }

                if (isDaytime && camera.position.z > 0 && !morningTextTriggered) {
                    morningTextTriggered = true;
                    showSubtitle("weird, why i can't hear the bird chirping anymore in the last couple days", 4000);
                }
                
                const isDoorOpen = doorMesh.userData.isOpen;
                if (currentCycle !== 2 && camera.position.z < -35 && camera.position.z > -55 && Math.abs(camera.position.x) < 9) {
                    
                    if (!isDaytime && hasEnteredHouse && !isNightmare) {
                        if (camera.position.z > -38.0) camera.position.z = -38.0;
                    } else {
                        if (camera.position.z < -36.5 && camera.position.z > -38.5) {
                            if (Math.abs(camera.position.x) > 1.8) {
                                camera.position.z = camera.position.z > -37.5 ? -36.5 : -38.5;
                            } else if (!isDoorOpen) {
                                camera.position.z = camera.position.z > -37.5 ? -36.5 : -38.5;
                            }
                        }
                    }

                    if (camera.position.z <= -37.5) {
                        if (camera.position.x > 7.0) camera.position.x = 7.0;
                        if (camera.position.x < -7.0) camera.position.x = -7.0;
                        if (camera.position.z < -52.0) camera.position.z = -52.0;
                    }

                    // Va chạm với khu vực giường ngủ
                    if (camera.position.x > -7.5 && camera.position.x < -2.5 && camera.position.z > -53 && camera.position.z < -45) {
                        const dRight = Math.abs(-2.5 - camera.position.x);
                        const dFront = Math.abs(-45 - camera.position.z);
                        if (dRight < dFront) camera.position.x = -2.5;
                        else camera.position.z = -45;
                    }

                    // Va chạm với bàn đầu giường (Đã được thu nhỏ hitbox cho khớp)
                    if (camera.position.x > -3.2 && camera.position.x < -0.8 && camera.position.z > -52.5 && camera.position.z < -50.5) {
                        const dRight = Math.abs(-0.8 - camera.position.x);
                        const dFront = Math.abs(-50.5 - camera.position.z);
                        if (dRight < dFront) camera.position.x = -0.8;
                        else camera.position.z = -50.5;
                    }

                    // Va chạm với bàn TV
                    if (camera.position.x > 1.0 && camera.position.x < 7.0 && camera.position.z > -53 && camera.position.z < -49.25) {
                        const dLeft = Math.abs(camera.position.x - 1.0);
                        const dRight = Math.abs(7.0 - camera.position.x);
                        const dFront = Math.abs(camera.position.z - (-49.25));
                        const min = Math.min(dLeft, dRight, dFront);
                        if (min === dLeft) camera.position.x = 1.0;
                        else if (min === dRight) camera.position.x = 7.0;
                        else camera.position.z = -49.25;
                    }
                }

                if (currentCycle !== 2 && !hasEnteredHouse && camera.position.z < -38 && Math.abs(camera.position.x) < 5) {
                    hasEnteredHouse = true;
                    hideRabbitHand();

                    if (doorMesh.userData.isOpen) {
                        doorMesh.userData.isOpen = false;
                        doorPivot.rotation.y = 0;
                        playSound('door_close');
                    }
                    playSound('click'); 

                    if (currentCycle === 1) { 
                        if (isFlashlightOn) toggleFlashlight(); 
                        flashlightDead = true; 
                        showSubtitle("The door slammed shut and locked! I need to find the light button...", 4000);
                    }
                }

                if (!isDaytime && currentCycle === 1 && !hasScared && camera.position.z < -14 && camera.position.z > -25) {
                    triggerJumpscare();
                }
            } else {
                if (sfx.house_steps && !sfx.house_steps.paused) { sfx.house_steps.pause(); sfx.house_steps.currentTime = 0; }
                if (sfx.path_steps && !sfx.path_steps.paused) { sfx.path_steps.pause(); sfx.path_steps.currentTime = 0; }
            }

            if (shakeTimer > 0) {
                shakeTimer -= delta;
                camera.position.x = cameraBasePos.x + (Math.random() - 0.5) * 0.2;
                camera.position.y = cameraBasePos.y + (Math.random() - 0.5) * 0.2;
                if (shakeTimer <= 0) {
                    camera.position.copy(cameraBasePos);
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth * pixelRatio, window.innerHeight * pixelRatio, false);
        });

        animate();

    </script>
</body>
</html>
